apiVersion: v1
kind: Secret
metadata:
  name: lrride-secrets
  namespace: lrride
type: Opaque
stringData:
  SECRET_KEY: "replace-with-50-char-secret"
  JWT_SECRET_KEY: "replace-with-50-char-jwt-secret"
  DB_NAME: "lrride_prod"
  DB_USER: "lrride"
  DB_PASSWORD: "replace-with-db-password"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  REDIS_URL: "redis://:replace-with-redis-password@redis-service:6379/0"
  REDIS_PASSWORD: "replace-with-redis-password"
  PAYSTACK_SECRET_KEY: "sk_live_replace"
  PAYSTACK_PUBLIC_KEY: "pk_live_replace"
  FLUTTERWAVE_SECRET_KEY: "FLWSECK-replace"
  FLUTTERWAVE_PUBLIC_KEY: "FLWPUBK-replace"
  TERMII_API_KEY: "replace"
  TERMII_BASE_URL: "https://api.ng.termii.com/api"
  TERMII_SENDER_ID: "LRRIDE"
  FCM_SERVER_KEY: "replace"
  SENTRY_DSN: ""
  ALLOWED_HOSTS: "yourdomain.com,www.yourdomain.com"
  CORS_ALLOWED_ORIGINS: "https://yourdomain.com"
  APP_VERSION: "1.0.0"
  DJANGO_SETTINGS_MODULE: "core.settings.production"