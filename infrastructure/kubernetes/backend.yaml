apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lrride
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: migrate
          image: lrride/backend:latest
          command: [python, manage.py, migrate, --noinput]
          envFrom:
            - secretRef:
                name: lrride-secrets
      containers:
        - name: backend
          image: lrride/backend:latest
          command: [daphne, -b, 0.0.0.0, -p, 8000, core.asgi:application]
          envFrom:
            - secretRef:
                name: lrride-secrets
          ports:
            - containerPort: 8000
          resources:
            requests: {memory: 256Mi, cpu: 250m}
            limits: {memory: 1Gi, cpu: 1000m}
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: lrride
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: lrride
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80