apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: lrride
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lrride
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: lrride-secrets, key: DB_NAME}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: lrride-secrets, key: DB_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: lrride-secrets, key: DB_PASSWORD}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests: {memory: 256Mi, cpu: 250m}
            limits: {memory: 1Gi, cpu: 1000m}
          readinessProbe:
            exec:
              command: [pg_isready, -U, lrride]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: lrride
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432