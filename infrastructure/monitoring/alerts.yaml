apiVersion: v1
kind: ConfigMap
metadata:
  name: lrride-alerts
  namespace: lrride
data:
  alerts.yml: |
    groups:
      - name: lrride.backend
        rules:
          - alert: BackendDown
            expr: up{job="lrride-backend"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "LR Ride backend is down"
              description: "Backend has been unreachable for more than 1 minute."

          - alert: HighErrorRate
            expr: rate(django_http_responses_total_by_status_total{status=~"5.."}[5m]) > 0.05
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High 5xx error rate"
              description: "More than 5% of requests returning 5xx errors."

          - alert: HighMemoryUsage
            expr: container_memory_usage_bytes{namespace="lrride"} / container_spec_memory_limit_bytes{namespace="lrride"} > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage in {{ $labels.container }}"
              description: "Container memory usage above 85%."

          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total{namespace="lrride"}[15m]) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod crash looping: {{ $labels.pod }}"
              description: "Pod has restarted multiple times in the last 15 minutes."

          - alert: RideQueueBacklog
            expr: celery_tasks_active{namespace="lrride"} > 100
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Celery task backlog growing"
              description: "More than 100 active Celery tasks — possible worker bottleneck."