upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

map $http_user_agent $is_mobile_ua {
    default 0;
    ~*Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera\ Mini|Mobile 1;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/ssl/certs/lrride.crt;
    ssl_certificate_key /etc/ssl/private/lrride.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    error_page 403 /desktop-only.html;

    location /api/ {
        if ($is_mobile_ua) {
            return 403;
        }
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /ws/ {
        if ($is_mobile_ua) {
            return 403;
        }
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    location /admin/ {
        if ($is_mobile_ua) {
            return 403;
        }
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        if ($is_mobile_ua) {
            return 403;
        }
        proxy_pass http://backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        if ($is_mobile_ua) {
            return 403;
        }
        proxy_pass http://backend;
        expires 30d;
    }

    location /health/ {
        proxy_pass http://backend;
        access_log off;
    }

    location / {
        if ($is_mobile_ua) {
            return 403;
        }
        proxy_pass http://frontend;
        proxy_set_header Host $host;
    }

    location = /desktop-only.html {
        default_type text/html;
        return 200 '<!doctype html><html lang="en"><head><meta charset="utf-8" />'
                   '<meta name="viewport" content="width=device-width, initial-scale=1" />'
                   '<title>Desktop Only</title><style>'
                   'body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111;}'
                   '.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;'
                   'text-align:center;padding:32px;}h1{margin:0 0 12px 0;font-size:24px;}'
                   'p{margin:0;font-size:16px;color:#444;}</style></head>'
                   '<body><div class="wrap"><div><h1>Desktop only</h1>'
                   '<p>This application is available on desktop browsers only.</p>'
                   '</div></div></body></html>';
    }
}