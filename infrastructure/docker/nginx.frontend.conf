map $http_user_agent $is_mobile_ua {
    default 0;
    ~*Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera\ Mini|Mobile 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        if ($is_mobile_ua) {
            return 403;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    error_page 403 /desktop-only.html;

    location = /desktop-only.html {
        default_type text/html;
        return 200 '<!doctype html><html lang="en"><head><meta charset="utf-8" />'
                   '<meta name="viewport" content="width=device-width, initial-scale=1" />'
                   '<title>Desktop Only</title><style>'
                   'body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111;}'
                   '.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;'
                   'text-align:center;padding:32px;}h1{margin:0 0 12px 0;font-size:24px;}'
                   'p{margin:0;font-size:16px;color:#444;}</style></head>'
                   '<body><div class="wrap"><div><h1>Desktop only</h1>'
                   '<p>This application is available on desktop browsers only.</p>'
                   '</div></div></body></html>';
    }
}