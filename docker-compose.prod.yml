version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: lrride_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: lrride_redis_prod
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  backend:
    image: lrride/backend:${APP_VERSION:-latest}
    container_name: lrride_backend_prod
    restart: always
    env_file:
      - ./backend/.env.production
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_worker:
    image: lrride/backend:${APP_VERSION:-latest}
    container_name: lrride_celery_prod
    restart: always
    command: celery -A core worker -l INFO -c 4 -Q default,rides,payments,notifications
    env_file:
      - ./backend/.env.production
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
    depends_on:
      - backend

  celery_beat:
    image: lrride/backend:${APP_VERSION:-latest}
    container_name: lrride_beat_prod
    restart: always
    command: celery -A core beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ./backend/.env.production
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
    depends_on:
      - celery_worker

  frontend:
    image: lrride/frontend:${APP_VERSION:-latest}
    container_name: lrride_frontend_prod
    restart: always

  nginx:
    image: nginx:1.25-alpine
    container_name: lrride_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      - ./infrastructure/ssl:/etc/ssl:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files: