<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ app_name }} Verification Code</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f5f7f3;
        font-family: Arial, Helvetica, sans-serif;
        color: #1f2937;
      }
      .wrapper {
        width: 100%;
        padding: 32px 16px;
        box-sizing: border-box;
      }
      .card {
        max-width: 560px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
      }
      .header {
        padding: 28px 32px 20px;
        background: linear-gradient(135deg, #6a1b9a 0%, #4c1d95 100%);
        color: #ffffff;
      }
      .brand {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        opacity: 0.9;
        margin-bottom: 8px;
      }
      .headline {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
        font-weight: 800;
      }
      .content {
        padding: 32px;
      }
      .intro {
        font-size: 15px;
        line-height: 1.7;
        margin: 0 0 22px;
        color: #374151;
      }
      .code-label {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #6b7280;
        margin-bottom: 10px;
      }
      .code-box {
        background: #f3e8ff;
        border: 1px solid #e9d5ff;
        border-radius: 16px;
        text-align: center;
        padding: 18px 16px;
        margin-bottom: 22px;
      }
      .code {
        font-size: 34px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: 0.22em;
        color: #6a1b9a;
      }
      .meta {
        font-size: 14px;
        line-height: 1.7;
        color: #4b5563;
        margin: 0 0 14px;
      }
      .footer {
        padding: 20px 32px 28px;
        border-top: 1px solid #f3f4f6;
        font-size: 12px;
        line-height: 1.6;
        color: #6b7280;
      }
      .footer strong {
        color: #374151;
      }
      @media only screen and (max-width: 600px) {
        .wrapper {
          padding: 16px 10px;
        }
        .header,
        .content,
        .footer {
          padding-left: 20px;
          padding-right: 20px;
        }
        .headline {
          font-size: 21px;
        }
        .code {
          font-size: 30px;
          letter-spacing: 0.16em;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="card">
        <div class="header">
          <div class="brand">{{ app_name }}</div>
          <h1 class="headline">{{ headline }}</h1>
        </div>
        <div class="content">
          <p class="intro">
            Use the verification code below to continue your action securely.
          </p>
          <div class="code-label">Verification code</div>
          <div class="code-box">
            <div class="code">{{ code }}</div>
          </div>
          <p class="meta">This code expires in {{ expiry_minutes }} minutes.</p>
          <p class="meta">{{ support_message }}</p>
        </div>
        <div class="footer">
          <strong>{{ app_name }}</strong> security notice. If you did not request this email, no action is required.
        </div>
      </div>
    </div>
  </body>
</html>
