<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block title %}Campus Portal{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #121417;
            --muted: #667085;
            --line: #e8eaef;
            --surface: #ffffff;
            --page: #f7f8f6;
            --brand: #006d36;
            --brand-2: #0f8a55;
            --dark: #101815;
            --red: #c62828;
            --green: #1f8a4c;
            --blue: #1769aa;
            --amber: #a86408;
            --cream: #fffaf0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--page);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            padding-bottom: env(safe-area-inset-bottom);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .wv-header {
            padding: calc(28px + env(safe-area-inset-top)) 24px 24px;
            background: var(--dark);
            color: #ffffff;
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
            box-shadow: 0 10px 24px rgba(18, 18, 18, 0.12);
        }

        .wv-header-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .wv-icon {
            width: 40px;
            height: 40px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            flex: 0 0 auto;
        }

        .wv-title {
            margin: 0;
            font-size: 24px;
            line-height: 1.15;
            font-weight: 800;
            letter-spacing: 0;
        }

        .wv-subtitle {
            margin: 10px 0 0;
            color: #d6d9df;
            font-size: 14px;
            line-height: 1.45;
        }

        .wv-main {
            padding: 14px 14px 18px;
        }

        .premium-shell {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: calc(10px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));
        }

        .premium-hero {
            position: relative;
            overflow: hidden;
            color: #ffffff;
            background: linear-gradient(135deg, var(--dark) 0%, #123f2c 54%, var(--brand) 100%);
            border-radius: 22px;
            padding: 20px 18px;
            box-shadow: 0 18px 40px rgba(16, 24, 21, 0.16);
            margin-bottom: 12px;
        }

        .premium-kicker {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border-radius: 999px;
            padding: 6px 10px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.13);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: rgba(255, 255, 255, 0.92);
            font-size: 11px;
            line-height: 1;
            font-weight: 800;
            text-transform: uppercase;
        }

        .premium-title {
            margin: 0;
            font-size: 25px;
            line-height: 1.08;
            font-weight: 900;
            letter-spacing: 0;
        }

        .premium-subtitle {
            margin: 9px 0 0;
            color: rgba(255, 255, 255, 0.86);
            font-size: 14px;
            line-height: 1.52;
        }

        .premium-stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin-top: 14px;
        }

        .premium-stat {
            min-width: 0;
            padding: 10px 8px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .premium-stat strong {
            display: block;
            font-size: 16px;
            line-height: 1.1;
        }

        .premium-stat span {
            display: block;
            margin-top: 4px;
            color: rgba(255, 255, 255, 0.76);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .premium-stack {
            display: grid;
            gap: 10px;
        }

        .premium-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .premium-card {
            background: #ffffff;
            border: 1px solid #e4e8e5;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 8px 22px rgba(16, 24, 40, 0.055);
        }

        .premium-card.soft {
            background: #fbfdfb;
        }

        .premium-card h2,
        .premium-card h3 {
            margin: 0 0 8px;
            color: var(--ink);
            font-size: 16px;
            line-height: 1.22;
            font-weight: 850;
            letter-spacing: 0;
        }

        .premium-card p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.55;
        }

        .premium-list {
            list-style: none;
            margin: 10px 0 0;
            padding: 0;
        }

        .premium-list li {
            display: flex;
            gap: 9px;
            padding: 9px 0;
            border-top: 1px solid #eef1ee;
            color: #34443d;
            font-size: 13px;
            line-height: 1.38;
        }

        .premium-mark {
            flex: 0 0 auto;
            width: 19px;
            height: 19px;
            border-radius: 10px;
            display: inline-grid;
            place-items: center;
            background: #e7f6ed;
            color: var(--brand);
            font-size: 11px;
            font-weight: 900;
        }

        .premium-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .premium-badge {
            display: inline-flex;
            border-radius: 999px;
            padding: 5px 9px;
            background: #e7f6ed;
            color: var(--brand);
            font-size: 11px;
            font-weight: 850;
        }

        .premium-callout {
            border-radius: 15px;
            padding: 13px;
            background: var(--cream);
            border: 1px solid #f0d6a6;
            color: #5f3b06;
            font-size: 13px;
            line-height: 1.5;
        }

        .wv-stack {
            display: grid;
            gap: 14px;
        }

        .wv-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .wv-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(16, 24, 40, 0.05);
        }

        .wv-card-pad {
            padding: 18px;
        }

        .wv-date {
            display: block;
            margin-bottom: 8px;
            color: var(--red);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .wv-card-title {
            margin: 0;
            font-size: 17px;
            line-height: 1.25;
            font-weight: 800;
        }

        .wv-body {
            margin: 9px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.55;
        }

        .wv-top-line {
            height: 5px;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            background: var(--brand);
        }

        .wv-card-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .wv-pill {
            flex: 0 0 auto;
            border-radius: 8px;
            padding: 5px 8px;
            font-size: 11px;
            font-weight: 800;
            background: #eef7f1;
            color: var(--green);
        }

        .wv-meta {
            display: grid;
            gap: 5px;
            margin: 0 0 12px;
            color: var(--muted);
            font-size: 13px;
        }

        .wv-activity {
            min-height: 146px;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 18px 12px;
        }

        .wv-activity-icon {
            width: 48px;
            height: 48px;
            border-radius: 24px;
            display: grid;
            place-items: center;
            margin-bottom: 12px;
            color: var(--brand);
            background: #f0e6ff;
            font-weight: 900;
        }

        .wv-section-title {
            margin: 0 0 12px;
            font-size: 18px;
            font-weight: 800;
        }

        .wv-alert {
            padding: 18px;
            background: #fff5f5;
            border: 1px solid #ffd7d7;
            border-radius: 16px;
        }

        .wv-alert-title {
            margin: 0 0 12px;
            color: #9b1c1c;
            font-size: 16px;
            font-weight: 800;
        }

        .wv-contact {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 13px;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 4px 14px rgba(16, 24, 40, 0.05);
        }

        .wv-contact + .wv-contact {
            margin-top: 10px;
        }

        .wv-contact-title {
            margin: 0;
            font-size: 14px;
            font-weight: 800;
        }

        .wv-contact-subtitle {
            margin: 3px 0 0;
            color: var(--muted);
            font-size: 12px;
        }

        .wv-call {
            padding: 8px 12px;
            border-radius: 10px;
            background: #ffe4e4;
            color: var(--red);
            font-size: 13px;
            font-weight: 800;
        }

        .wv-list {
            margin: 0;
            padding: 0;
            list-style: none;
            overflow: hidden;
        }

        .wv-list-item {
            display: flex;
            gap: 12px;
            padding: 16px;
            border-bottom: 1px solid #f0f1f4;
        }

        .wv-list-item:last-child {
            border-bottom: 0;
        }

        .wv-dot {
            width: 10px;
            height: 10px;
            margin-top: 5px;
            border-radius: 999px;
            background: var(--brand);
            flex: 0 0 auto;
        }

        @media (min-width: 540px) {
            .wv-main { max-width: 540px; margin: 0 auto; }
        }

        @media (max-width: 380px) {
            .premium-shell { padding-left: 10px; padding-right: 10px; }
            .premium-hero { padding: 18px 15px; border-radius: 18px; }
            .premium-title { font-size: 23px; }
            .premium-card { padding: 13px; }
            .premium-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
