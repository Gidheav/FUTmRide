{% extends "admin/change_list.html" %}

{% block object-tools-items %}
  {{ block.super }}
  <li>
    <form method="post" action="publish/" style="display:inline;">
      {% csrf_token %}
      <button
        type="submit"
        class="button"
        style="
          background: #1a7340;
          color: #ffffff;
          border: none;
          padding: 8px 16px;
          border-radius: 4px;
          font-size: 13px;
          font-weight: bold;
          cursor: pointer;
          display: inline-flex;
          align-items: center;
          gap: 6px;
          margin-left: 4px;
        "
        onclick="return confirm('Publish a new snapshot of all active locations to the mobile app?');"
      >
        ✅ Publish Locations
      </button>
    </form>
  </li>
  <li>
    <a
      href="bulk-import/"
      class="button"
      style="
        background: #0c5460;
        color: #ffffff;
        padding: 8px 16px;
        border-radius: 4px;
        font-size: 13px;
        font-weight: bold;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-left: 4px;
      "
    >
      📥 Bulk Import JSON
    </a>
  </li>
{% endblock %}
