version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: lrride_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: lrride_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: lrride_backend
    command: >
      sh -c "python manage.py migrate --settings=core.settings.development &&
             daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.development
    volumes:
      - ./backend:/app
      - media_files:/app/media
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: lrride_celery
    command: celery -A core worker -l INFO -c 4 -Q default,rides,payments,notifications
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.development
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: lrride_beat
    command: celery -A core beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.development
    volumes:
      - ./backend:/app
    depends_on:
      - celery_worker

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    container_name: lrride_frontend
    ports:
      - "5174:80"

volumes:
  postgres_data:
  redis_data:
  media_files: